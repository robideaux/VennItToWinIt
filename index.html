<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Venn It To Win It</title>
    <meta name="description" content="Seven words, three hidden groups. Sort them into a Venn diagram to reveal what connects them." />
    <!-- Link preview card for chat apps and social sites. Read from this static file by
         crawlers that run no JavaScript, so it is the same card for every link: there is
         no server to vary it per puzzle, and a per-puzzle card would spoil the answers.
         og:image must be an absolute URL. It is generated by scripts/make-og-image.mjs. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Venn It To Win It" />
    <meta property="og:title" content="Venn It To Win It" />
    <meta property="og:description" content="Seven words, three hidden groups. Sort them into a Venn diagram to reveal what connects them." />
    <meta property="og:image" content="https://vennittowinit.netlify.app/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Three overlapping circles in red, green and violet" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="manifest" href="/manifest.json" />
    <link rel="apple-touch-icon" href="/icon.svg" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black" />
    <meta name="apple-mobile-web-app-title" content="VennItToWinIt" />
    <!-- Two tags so the very first paint is right before any script runs. Once loaded,
         src/utils/theme.js replaces them with a single managed tag, because a manual
         Light/Dark override in Settings is invisible to a media query.
         Values match --color-surface: the chrome sits against the app's header. -->
    <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#1a1a1a" media="(prefers-color-scheme: dark)" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
